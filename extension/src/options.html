<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>career-ops settings</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 560px; margin: 24px auto; padding: 0 16px; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    code { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; font-size: 12px; word-break: break-all; }
    pre { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>career-ops companion</h1>
  <p class="meta">The extension talks only to the career-ops app running on your own computer.</p>

  <label for="server">App address</label>
  <input id="server" placeholder="http://127.0.0.1:3000">
  <div class="actions" style="grid-template-columns: auto 1fr; align-items: center;">
    <button id="save" class="primary">Save</button>
    <span id="status" class="status" role="status"></span>
  </div>

  <h2 style="margin-top:28px">One-time setup</h2>
  <p>Your app blocks other websites and extensions by default. Allow this extension by starting the app with:</p>
  <pre id="cmd"></pre>
</body>
<script src="options.js" type="module"></script>
</html>
